name: Build InfinityFree package
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deployment package
        run: |
          set -e
          rm -rf dist hashttick-infinityfree.zip
          mkdir -p dist
          cp -r api assets lib partials dist/
          cp admin.php config.php dictionary.php index.php login.php register.php settings.php statistics.php study.php vocabulary.php dist/
          cp config.local.php.example dist/config.local.php
          (cd dist && zip -qr ../hashttick-infinityfree.zip .)
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: hashttick-infinityfree
          path: hashttick-infinityfree.zip
          if-no-files-found: error
